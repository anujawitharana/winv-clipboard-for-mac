name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          swift --version
          xcodebuild -version || true

      - name: Make Scripts Executable
        run: chmod +x Scripts/*.sh

      - name: Run Test Suite
        run: swift test

      - name: Build Standalone Application Bundle
        run: ./Scripts/build_app.sh
