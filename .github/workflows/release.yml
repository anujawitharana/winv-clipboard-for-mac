name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          swift --version

      - name: Make Scripts Executable
        run: chmod +x Scripts/*.sh

      - name: Package Distribution Release (DMG & Zip)
        run: ./Scripts/package_release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WinVClipboard.dmg
            WinVClipboard.dmg.sha256
            WinVClipboard.app.zip
            WinVClipboard.app.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
