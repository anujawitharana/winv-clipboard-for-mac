name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application Bundle
        run: ./Scripts/build_app.sh

      - name: Package Distribution Release (DMG & Zip)
        run: |
          ./Scripts/package_release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WinVClipboard.dmg
            WinVClipboard.dmg.sha256
            WinVClipboard.app.zip
            WinVClipboard.app.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
